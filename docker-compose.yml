version: '3.8'

services:
  diverse-quiz-hub:
    build: .
    ports:
      - "3003:3003"
      - "5173:5173"
    environment:
      - NODE_ENV=production
    volumes:
      - ./attached_assets:/app/attached_assets:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3003/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  default:
    name: diverse-quiz-hub-network
