# File: nginx.conf (in your local project root)
server {
    listen 5000;
    listen [::]:5000; # Listen on IPv6 as well

    root /usr/share/nginx/html; # Ensure this path is where your built app files are copied
    index index.html index.htm; # Default file to serve

    # Handle static assets (CSS, JS, images, etc.)
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Handle all other requests (SPA routing)
    location / {
        try_files $uri $uri/ /index.html; # Essential for single-page applications (SPAs)
    }
}

